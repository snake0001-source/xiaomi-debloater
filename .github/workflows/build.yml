name: Build EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 取得程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 安裝 PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 4. 執行打包
      run: |
        pyinstaller --onefile --noconsole --add-data "bloatware.json;." debloater.py

    - name: 5. 上傳打包好的 EXE (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: xiaomi-debloater-exe
        path: dist/*.exe
