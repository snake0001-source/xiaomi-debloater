name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # 必須使用 windows 環境才能正確打包 Windows .exe

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝打包工具 (PyInstaller)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 打包成單一執行檔
      run: |
        pyinstaller --onefile --noconsole --add-data "bloatware.json;." debloater.py

    - name: 上傳 .exe 至 GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/debloater.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
