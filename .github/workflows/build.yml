name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # 當您建立並推送開頭為 v 的 Tag（例如 v1.1.2）時觸發
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝打包工具 (PyInstaller)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 打包成單一執行檔
      run: |
        pyinstaller --onefile --noconsole --add-data "bloatware.json;." debloater.py

    - name: 上傳 .exe 至 GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/debloater.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
